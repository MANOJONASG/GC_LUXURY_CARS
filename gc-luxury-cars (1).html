<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Luxury Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b0b0c;
  --surface:#141416;
  --surface-2:#1c1c1f;
  --hairline:#2a2a2d;
  --gold:#c9a24b;
  --gold-bright:#e8c876;
  --silver:#b9bec7;
  --text:#eeece6;
  --text-dim:#9a9994;
  --danger:#a33636;
  --success:#3f7d4a;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
body{-webkit-font-smoothing:antialiased;}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--gold);color:#0b0b0c;}

/* ---------- layout shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;background:rgba(11,11,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.5px;}
.brand-logo{width:54px;height:54px;object-fit:contain;border-radius:50%;background:#050506;}
.brand .wing{color:var(--gold);font-size:22px;}
.brand small{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:3px;color:var(--gold);font-weight:500;}
nav.mainnav{display:flex;gap:4px;}
nav.mainnav button{background:none;border:none;color:var(--text-dim);padding:8px 14px;font-size:13px;letter-spacing:.3px;border-radius:3px;transition:.15s;}
nav.mainnav button:hover{color:var(--text);}
nav.mainnav button.active{color:var(--gold-bright);background:var(--surface-2);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.admin-session{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--hairline);}
.admin-identity{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.8px;color:var(--gold-bright);}
.admin-identity .admin-icon{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--gold);border-radius:50%;font-size:13px;background:rgba(201,162,75,.12);}
.admin-session .btn.danger{padding:7px 12px;background:rgba(175,35,35,.18);}
.plate{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;background:var(--plate,#0e0e0f);border:1px solid var(--hairline);
  padding:5px 10px;border-radius:3px;color:var(--silver);white-space:nowrap;}
.btn{border:1px solid var(--hairline);background:var(--surface-2);color:var(--text);padding:9px 16px;border-radius:3px;font-size:13px;font-weight:500;transition:.15s;}
.btn:hover{border-color:var(--gold);color:var(--gold-bright);}
.btn.gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#161200;border:none;font-weight:600;}
.btn.gold:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;}
.btn.small{padding:6px 11px;font-size:12px;}
.btn.danger{border-color:var(--danger);color:#e79b9b;}

main{flex:1;}
.section{padding:64px 28px;max-width:1240px;margin:0 auto;}
.section h2{font-family:var(--font-display);font-size:30px;margin:0 0 6px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:block;}

/* ---------- hero / banner carousel ---------- */
.hero{position:relative;height:78vh;min-height:520px;overflow:hidden;border-bottom:1px solid var(--hairline);}
.hero-slide{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .8s ease;display:flex;align-items:flex-end;
  background:radial-gradient(ellipse at 30% 20%, rgba(201,162,75,.18), transparent 55%),
             radial-gradient(ellipse at 80% 80%, rgba(255,255,255,.05), transparent 60%),
             linear-gradient(180deg, rgba(11,11,12,.88) 0%, rgba(21,21,23,.78) 55%, rgba(11,11,12,.92) 100%);}
.hero-slide.active{opacity:1;}
.hero-content{position:relative;z-index:2;padding:0 28px 64px;max-width:1240px;margin:0 auto;width:100%;}
.hero-content .eyebrow{color:var(--gold-bright);}
.hero-content h1{font-family:var(--font-display);font-size:56px;line-height:1.05;margin:0 0 14px;max-width:680px;}
.hero-content p{color:var(--text-dim);max-width:520px;margin:0 0 24px;font-size:15px;}
.hero-dots{position:absolute;bottom:24px;right:28px;display:flex;gap:8px;}
.hero-dots span{width:22px;height:3px;background:var(--hairline);cursor:pointer;}
.hero-dots span.active{background:var(--gold);}
.hero-cta{display:flex;gap:12px;}
.hero-showroom{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25;filter:saturate(.8);pointer-events:none;}
.showroom-section{max-width:1240px;margin:0 auto;padding:20px 28px 64px;}
.showroom-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:24px;}
.showroom-photo{width:100%;height:310px;object-fit:cover;object-position:center;background:#0b0b0c;border:1px solid var(--hairline);border-radius:6px;display:block;}
.showroom-photo.tall{height:420px;object-position:center 45%;}
.showroom-caption{padding:12px 0 0;color:var(--text-dim);font-size:12px;}
@media(max-width:760px){.showroom-grid{grid-template-columns:1fr;}.showroom-photo,.showroom-photo.tall{height:260px;}}

/* car silhouette used as decorative motif in hero */
.silhouette{position:absolute;right:-40px;bottom:-10px;width:52%;max-width:700px;opacity:.9;pointer-events:none;}

/* ---------- catalog ---------- */
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:28px;}
.car-card{background:var(--surface);border:1px solid var(--hairline);border-radius:6px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;}
.car-card:hover{border-color:var(--gold);transform:translateY(-2px);}
.car-thumb{height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%, rgba(255,255,255,.08), transparent 60%);}
.car-thumb svg,.car-thumb img{width:88%;height:138px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));}
.car-card .body{padding:14px 16px 16px;}
.car-card .cat{font-family:var(--font-mono);font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
.car-card h3{font-family:var(--font-display);font-size:19px;margin:4px 0 8px;}
.car-card .spec-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:10px;}
.car-card .price{font-family:var(--font-mono);font-size:15px;color:var(--gold-bright);}
.stock-tag{position:absolute;top:10px;right:10px;z-index:3;font-family:var(--font-mono);font-size:9px;padding:3px 7px;border-radius:2px;letter-spacing:1px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.45);}
.stock-tag.in{background:rgba(35,135,55,.72);color:#d5ffda;border:1px solid #67d879;}
.stock-tag.low{background:rgba(175,35,35,.78);color:#ffe0e0;border:1px solid #ff7777;}
.stock-tag.out{background:rgba(70,70,75,.9);color:#f0f0f0;border:1px solid #a0a0a8;}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.filters button{background:var(--surface-2);border:1px solid var(--hairline);color:var(--text-dim);padding:7px 14px;border-radius:20px;font-size:12px;}
.filters button.active{color:var(--gold-bright);border-color:var(--gold);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;max-width:920px;width:100%;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;background:var(--surface-2);border:1px solid var(--hairline);color:var(--text);
  width:32px;height:32px;border-radius:50%;font-size:16px;line-height:1;z-index:5;}
.modal.small{max-width:460px;}

/* vehicle detail */
.vd-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:0;}
@media(max-width:760px){.vd-grid{grid-template-columns:1fr;}}
.vd-viewer{background:radial-gradient(ellipse at 50% 70%, rgba(255,255,255,.06), transparent 65%), #0e0e10;
  padding:30px 20px 20px;display:flex;flex-direction:column;align-items:center;border-radius:8px 0 0 8px;position:relative;}
.vd-viewer .hint{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1.5px;margin-top:10px;}
.vd-stage{width:100%;height:230px;display:flex;align-items:center;justify-content:center;perspective:900px;touch-action:none;cursor:grab;}
.vd-stage:active{cursor:grabbing;}
.vd-car{width:82%;display:flex;align-items:center;justify-content:center;}
.vd-car svg,.vd-car img{width:92%;height:220px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));}
.vd-gallery-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;}
.vd-gallery-controls button{width:30px;height:30px;padding:0;border-radius:50%;}
.vd-frame-count{min-width:48px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;}
.vd-controls{display:flex;gap:8px;margin-top:14px;}
.vd-panel{padding:26px 26px 26px;}
.vd-panel .eyebrow{margin-bottom:4px;}
.vd-panel h2{font-family:var(--font-display);font-size:26px;margin:0 0 6px;}
.vd-panel .tagline{color:var(--text-dim);font-size:13px;margin-bottom:14px;font-style:italic;}
.vd-panel .price-big{font-family:var(--font-mono);color:var(--gold-bright);font-size:22px;margin-bottom:16px;}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:16px;font-size:12.5px;}
.spec-grid div span{display:block;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;}
.vd-desc{font-size:13.5px;line-height:1.6;color:#d9d7d0;margin-bottom:16px;}
.optlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.optlist span{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--hairline);padding:4px 8px;border-radius:3px;color:var(--silver);}
.vd-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.vd-actions button{padding:12px;}

/* forms */
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-family:var(--font-mono);letter-spacing:.5px;}
.form-row input,.form-row select{width:100%;background:var(--surface-2);border:1px solid var(--hairline);color:var(--text);
  padding:10px 12px;border-radius:4px;font-size:14px;font-family:var(--font-body);}
.form-row input[type="file"]{padding:8px;}
.form-row textarea{width:100%;min-height:120px;resize:vertical;background:var(--surface-2);border:1px solid var(--hairline);color:var(--text);
  padding:10px 12px;border-radius:4px;font-size:14px;font-family:var(--font-body);line-height:1.5;}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--gold);}
.form-row textarea:focus{outline:none;border-color:var(--gold);}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.panel-title{font-family:var(--font-display);font-size:22px;margin:0 0 4px;}
.panel-sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
.result-box{background:var(--surface-2);border:1px solid var(--hairline);border-radius:6px;padding:16px;margin-top:16px;}
.result-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--hairline);}
.result-line:last-child{border-bottom:none;}
.result-line b{color:var(--gold-bright);font-family:var(--font-mono);}
.note{font-size:11.5px;color:var(--text-dim);margin-top:12px;line-height:1.5;border-left:2px solid var(--gold);padding-left:10px;}

/* tabs */
.tabbar{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--hairline);}
.tabbar button{background:none;border:none;color:var(--text-dim);padding:10px 16px;font-size:13px;border-bottom:2px solid transparent;}
.tabbar button.active{color:var(--gold-bright);border-color:var(--gold);}

/* admin table */
table.admin{width:100%;border-collapse:collapse;font-size:13px;}
table.admin th{text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);
  padding:10px 8px;border-bottom:1px solid var(--hairline);}
table.admin td{padding:8px;border-bottom:1px solid var(--hairline);}
table.admin input{background:var(--surface-2);border:1px solid var(--hairline);color:var(--text);padding:5px 8px;border-radius:3px;width:100%;font-size:12.5px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:10px;}
.bar{flex:1;background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-radius:3px 3px 0 0;position:relative;}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--text-dim);font-family:var(--font-mono);}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);
  border:1px solid var(--gold);color:var(--text);padding:12px 20px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{border-top:1px solid var(--hairline);padding:28px;text-align:center;color:var(--text-dim);font-size:12px;}
.badge-login{font-family:var(--font-mono);font-size:11px;color:var(--gold-bright);}

@media(max-width:900px){
  .topbar{flex-wrap:wrap;gap:12px;padding:14px 20px;}
  nav.mainnav{order:3;width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
  nav.mainnav button{flex:0 0 auto;white-space:nowrap;}
  .topbar-right{margin-left:auto;}
  .hero-content h1{font-size:44px;max-width:600px;}
  .section{padding:48px 20px;}
  .showroom-section{padding:20px 20px 48px;}
  table.admin{display:block;overflow-x:auto;white-space:nowrap;}
}

@media(max-width:600px){
  .topbar{padding:12px 14px;}
  .brand{font-size:16px;gap:7px;}
  .brand-logo{width:46px;height:46px;}
  .brand small{font-size:7px;letter-spacing:2px;}
  .topbar-right{width:100%;margin-left:0;justify-content:flex-end;}
  .admin-session{margin-left:auto;padding-left:10px;gap:7px;}
  .admin-identity{font-size:9px;letter-spacing:.4px;}
  nav.mainnav{gap:0;}
  nav.mainnav button{padding:8px 10px;font-size:12px;}
  .hero{height:620px;min-height:0;}
  .hero-content{padding:0 20px 58px;}
  .hero-content h1{font-size:34px;line-height:1.08;}
  .hero-content p{font-size:13px;line-height:1.5;}
  .hero-cta{flex-wrap:wrap;gap:8px;}
  .hero-cta .btn{flex:1 1 150px;}
  .hero-dots{right:20px;bottom:22px;}
  .section,.showroom-section{padding-left:14px;padding-right:14px;}
  .section h2{font-size:26px;}
  .catalog-grid{grid-template-columns:1fr;gap:14px;}
  .car-thumb{height:175px;}
  .car-thumb svg,.car-thumb img{width:88%;height:150px;}
  .form-grid2{grid-template-columns:1fr;}
  .modal-overlay{padding:14px 8px;}
  .modal{border-radius:6px;}
  .modal-close{top:10px;right:10px;}
  .vd-viewer{padding:24px 12px 18px;border-radius:6px 6px 0 0;}
  .vd-panel{padding:22px 16px;}
  .vd-actions{grid-template-columns:1fr;}
  .vd-stage{height:210px;}
  .vd-car svg,.vd-car img{height:190px;}
  .result-line{gap:12px;align-items:center;}
  footer{padding:22px 14px;font-size:11px;line-height:1.5;}
}
</style>
</head>

async function hashLocalPassword(password, salt = crypto.getRandomValues(new Uint8Array(16))){
  if(!crypto.subtle) throw new Error('Abra o site pelo Live Server do VS Code para habilitar o cadastro local.');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const digest = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:120000, hash:'SHA-256'}, key, 256);
  return {salt:btoa(String.fromCharCode(...salt)), passwordHash:btoa(String.fromCharCode(...new Uint8Array(digest)))};
}
async function verifyLocalPassword(account, password){
  const salt = Uint8Array.from(atob(account.salt), character => character.charCodeAt(0));
  const {passwordHash} = await hashLocalPassword(password, salt);
  return samePasswordHash(passwordHash, account.passwordHash);
}
function samePasswordHash(first, second){
  if(first.length !== second.length) return false;
  let difference = 0;
  for(let index = 0; index < first.length; index++) difference |= first.charCodeAt(index) ^ second.charCodeAt(index);
  return difference === 0;
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
}

/* ============================================================
   ÁUDIO DO MOTOR — síntese em tempo real via Web Audio API
   (não são gravações reais dos veículos, e sim uma simulação
   sonora baseada no tipo de motor de cada carro)
   ============================================================ */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playEngineSound(engineType){
  const ctx = getAudioCtx();
  if(ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);
  master.gain.exponentialRampToValueAtTime(0.5, now+0.08);

  const profiles = {
    v12:  {base:70, harmonics:[1,2,3,4,5], rev:1900, dur:2.6, growl:.35},
    v10:  {base:80, harmonics:[1,2,3,4], rev:2000, dur:2.4, growl:.3},
    v8:   {base:55, harmonics:[1,2,2.5,4], rev:1500, dur:2.2, growl:.5},
    v8t:  {base:50, harmonics:[1,2,3], rev:1500, dur:2.2, growl:.4, turbo:true},
    v6t:  {base:60, harmonics:[1,2,3], rev:1600, dur:2.0, growl:.35, turbo:true},
    i6t:  {base:65, harmonics:[1,2,3], rev:1550, dur:2.0, growl:.3, turbo:true},
    i6:   {base:60, harmonics:[1,2], rev:900, dur:1.6, growl:.15},
    flat6:{base:75, harmonics:[1,2,3,4], rev:1700, dur:2.1, growl:.4},
    electric:{base:220, harmonics:[1,1.5,2], rev:1400, dur:1.8, growl:0, whine:true},
  };
  const p = profiles[engineType] || profiles.v8;

  p.harmonics.forEach((h,i)=>{
    const osc = ctx.createOscillator();
    osc.type = p.whine ? 'sine' : (i===0?'sawtooth':'square');
    const g = ctx.createGain();
    g.gain.value = 1/(i+1.6);
    osc.connect(g); g.connect(master);
    const startFreq = p.base*h;
    const endFreq = p.rev*h*(p.whine?1.6:1);
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(endFreq, now+p.dur*0.55);
    osc.frequency.exponentialRampToValueAtTime(startFreq*1.2, now+p.dur);
    osc.start(now); osc.stop(now+p.dur+0.05);
  });

  if(p.growl>0){
    const noise = ctx.createBufferSource();
    const buf = ctx.createBuffer(1, ctx.sampleRate*p.dur, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * p.growl;
    noise.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type='bandpass'; filt.frequency.value = p.base*3;
    noise.connect(filt); filt.connect(master);
    noise.start(now); noise.stop(now+p.dur);
  }
  master.gain.exponentialRampToValueAtTime(0.0001, now+p.dur+0.1);
}

async function syncCatalogFromApi(){
  if(!API_BASE) return;
  try{
    const response = await fetch(`${API_BASE}/cars`);
    if(!response.ok) return;
    const cars = await response.json();
    if(!cars.length) return;
    CATALOG = cars.map(car => {
      const localCar = CAR_DATA.find(item => item.id === car.id) || {};
      return {...localCar, ...car, desc:car.description || localCar.desc || '', engineType:car.engine_type || localCar.engineType || 'v8', accel:car.acceleration !== '—' ? car.acceleration : (localCar.accel || '—'), topSpeed:car.top_speed !== '—' ? car.top_speed : (localCar.topSpeed || '—'), images:car.images.length ? car.images : (localCar.images || [])};
    });
    ADMIN_CARS = CATALOG;
    render();
  }catch(error){ /* Mantém o catálogo local quando a API estiver indisponível. */ }
}

async function loadAdminRecords(showFeedback = false){
  const holder = document.getElementById('admin-records');
  if(!holder || !API_BASE || !state.apiUserId) return;
  const refreshButton = document.getElementById('refresh-records');
  if(showFeedback && refreshButton){ refreshButton.disabled = true; refreshButton.textContent = 'Atualizando...'; }
  try{
    const response = await fetch(`${API_BASE}/admin/records`, {headers:apiHeaders()});
    if(!response.ok) throw new Error('records request failed');
    const data = await response.json();
  const records = [...data.orders.map(item => ({...item, type:'orders', label:`Pedido · ${item.brand} ${item.model}`, value:fmtBRL(item.amount)})), ...data.trades.map(item => ({...item, type:'trades', label:`Troca · ${item.brand} ${item.model}`, value:fmtBRL(item.remaining_amount)})), ...data.testDrives.map(item => ({...item, type:'testDrives', label:`Test drive · ${item.brand} ${item.model}`, value:`${item.date} ${item.time}`}))];
  const statusOptions = ['pending','approved','rejected','scheduled','completed'];
  holder.innerHTML = records.length ? records.map(item => `<div class="result-line"><span>${item.label}<small style="display:block;color:var(--text-dim)">${item.value || ''}</small></span><select onchange="updateRecordStatus('${item.type}', ${item.id}, this.value)">${statusOptions.map(status => `<option value="${status}" ${status===item.status?'selected':''}>${status}</option>`).join('')}</select></div>`).join('') : '<div class="result-line"><span>Nenhum registro encontrado.</span></div>';
    holder.innerHTML += `<h4 style="font-family:var(--font-display);margin:20px 0 8px">Histórico de alterações</h4>${data.history.length ? data.history.map(item => `<div class="result-line"><span>${item.action} · ${item.entity} #${item.entity_id}</span><b>${item.user_name || 'sistema'}</b></div>`).join('') : '<div class="result-line"><span>Nenhuma alteração registrada.</span></div>'}`;
    if(showFeedback) toast(`Registros atualizados às ${new Date().toLocaleTimeString('pt-BR')}.`);
  }catch(error){
    holder.textContent='Não foi possível conectar ao servidor. Inicie o Node com npm start e tente novamente.';
    if(showFeedback) toast('Servidor offline. Execute npm start.');
  }finally{
    if(refreshButton){ refreshButton.disabled = false; refreshButton.textContent = 'Atualizar registros'; }
  }
}

function changeViewerFrame(direction){
  const image = document.querySelector('#vd-car img');
  const frames = state.currentCar && state.currentCar.images || [];
  if(!image || frames.length < 2) return;
  const current = Number(image.dataset.frame) || 0;
  const next = (current + direction + frames.length) % frames.length;
  image.src = frames[next];
  image.dataset.frame = next;
  const counter = document.getElementById('vd-frame-count');

function confirmPayment(method){
  if(!validateTradeDetails()) return;
  if(API_BASE){
    if(!state.apiUserId){ toast('Entre na sua conta para finalizar o pagamento.'); return; }

  }

}

/* PIX BR Code (EMV) — payload estático de demonstração, formato real */
function pixPayload(car, amount = state.paymentAmount ?? car.price){
  function tlv(id,value){ const len = String(value.length).padStart(2,'0'); return id+len+value; }
  const merchantName = "GC LUXURY CARS".substring(0,25);
  const merchantCity = "SAO PAULO".substring(0,15);
  const key = PIX_KEY;
  const amountValue = amount.toFixed(2);
  const gui = tlv('00','br.gov.bcb.pix');
  const chave = tlv('01', key);
  const mai = tlv('26', gui+chave);
  let payload = tlv('00','01') + mai + tlv('52','0000') + tlv('53','986') +
    tlv('54', amountValue) + tlv('58','BR') + tlv('59', merchantName) + tlv('60', merchantCity) + tlv('62', tlv('05','***'));
  payload += '6304';
  // CRC16-CCITT calculado sobre o payload (com placeholder 6304 no fim)
  function crc16(str){
    let crc = 0xFFFF;
    for(let i=0;i<str.length;i++){
      crc ^= str.charCodeAt(i) << 8;
      for(let j=0;j<8;j++){
        crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) : (crc<<1);
        crc &= 0xFFFF;
      }
    }
    return crc.toString(16).toUpperCase().padStart(4,'0');
  }
  return payload + crc16(payload);
}
function renderQR(car){
  const holder = document.getElementById('qr-holder');
  if(!holder) return;
  holder.innerHTML='';
  new QRCode(holder, {text: pixPayload(car), width:180, height:180});
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  if(!email.includes('@') || !password){ toast('Informe um e-mail e uma senha válidos.'); return; }
  try{
    let account;
    if(API_BASE){
      const response = await fetch(`${API_BASE}/auth/login`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password})});
      const result = await response.json();
      if(!response.ok){ toast(result.error || 'E-mail ou senha inválidos.'); return; }
      account = result;
      state.apiUserId = result.id;
      state.apiToken = result.token;
      state.isAdmin = result.role === 'admin';
    }else{
      const savedAccount = getLocalUsers().find(user => user.email === email.toLowerCase());
      if(!savedAccount){ toast('E-mail ou senha inválidos.'); return; }
      if(!await verifyLocalPassword(savedAccount, password)){ toast('E-mail ou senha inválidos.'); return; }
      account = savedAccount;
      state.isAdmin = account.role === 'admin';
    }
    state.user = {name:account.name, email:account.email};
    state.currentTab = state.isAdmin ? 'admin' : 'home';
    toast(state.isAdmin ? 'Login administrativo realizado.' : 'Login realizado com sucesso.');
    closeModal();
  }catch(error){
    console.error('Falha ao conectar ao servidor de autenticação:', error);
    toast(error.message || 'Não foi possível entrar na conta.');
  }
}
async function doSignup(){
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-pass').value;
  const role = document.getElementById('signup-role').value;
  if(!name || !email.includes('@') || password.length < 6){ toast('Preencha nome, e-mail válido e senha com pelo menos 6 caracteres.'); return; }
  const adminConfirmation = role === 'admin' ? document.getElementById('signup-admin-pass').value : '';
  if(role === 'admin' && !API_BASE && adminConfirmation !== LOCAL_ADMIN_PASSWORD){
    toast('Senha do administrador principal incorreta.');
    return;
  }
  try{
    let result;
    if(API_BASE){
      const response = await fetch(`${API_BASE}/auth/register`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, email, password, role, adminConfirmation})});
      result = await response.json();
      if(!response.ok){ toast(result.error || 'Não foi possível criar a conta.'); return; }
    }else{
      const normalizedEmail = email.toLowerCase();
      const users = getLocalUsers();
      if(users.some(user => user.email === normalizedEmail)){ toast('Este e-mail já está cadastrado.'); return; }
      const {salt, passwordHash} = await hashLocalPassword(password);
      result = {name, email:normalizedEmail, salt, passwordHash, role};
      localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify([...users, result]));
    }
    modalType = 'login';
    render();
    document.getElementById('login-email').value = result.email;
    toast('Conta criada. Entre com seu e-mail e senha.');
  }catch(error){
    console.error('Falha ao conectar ao servidor de cadastro:', error);
    toast(error.message || 'Não foi possível salvar a conta neste navegador.');
  }
}

function calcFinancing(){
  const car = CATALOG.find(c=>c.id==document.getElementById('fin-car').value);
  const down = parseFloat(document.getElementById('fin-down').value);
  const term = parseInt(document.getElementById('fin-term').value);
  const ratePercent = parseFloat(document.getElementById('fin-rate').value);
  if(!car || !Number.isFinite(down) || down < 0 || down > car.price || !Number.isInteger(term) || term < 6 || term > 72 || !Number.isFinite(ratePercent) || ratePercent < 0){
    toast('Confira entrada, prazo e taxa do financiamento.'); return;
  }
  const rate = ratePercent/100;
  const financed = Math.max(car.price - down, 0);
  const pmt = rate>0 ? financed*rate*Math.pow(1+rate,term)/(Math.pow(1+rate,term)-1) : financed/term;
  const total = pmt*term + down;
  document.getElementById('fin-result').innerHTML = `
    <div class="result-box">
      <div class="result-line"><span>Valor financiado</span><b>${fmtBRL(financed)}</b></div>
      <div class="result-line"><span>Parcela mensal estimada</span><b>${fmtBRL(pmt)}</b></div>
      <div class="result-line"><span>Total pago ao final (${term}x)</span><b>${fmtBRL(total)}</b></div>
    </div>`;
  document.getElementById('fin-result').innerHTML += `<button class="btn gold" style="margin-top:12px" onclick="openPayment('financing', ${car.id}, ${financed})">Finalizar compra financiada</button>`;
}

function calcTradeIn(){
  const model = document.getElementById('ti-model').value || 'Veículo informado';
  const year = parseInt(document.getElementById('ti-year').value);
  const km = parseInt(document.getElementById('ti-km').value);
  const target = CATALOG.find(c=>c.id==document.getElementById('ti-target').value);
  if(!Number.isInteger(year) || year < 1950 || year > new Date().getFullYear() || !Number.isInteger(km) || km < 0 || !target){
    toast('Informe ano e quilometragem válidos.'); return;
  }
  // estimativa simulada (idade do carro + depreciação por km) — referência, não é a FIPE oficial
  const age = Math.max(new Date().getFullYear()-year, 0);
  let base = 180000 * Math.pow(0.9, age);
  base -= (km/10000)*3000;
  base = Math.max(base, 15000);
  const remaining = Math.max(target.price - base, 0);
  document.getElementById('ti-result').innerHTML = `
    <div class="result-box">
      <div class="result-line"><span>${model} (${year})</span><b>${fmtBRL(base)}</b></div>
      <div class="result-line"><span>Valor a financiar/pagar após a troca</span><b>${fmtBRL(remaining)}</b></div>
      <div class="result-line"><span>Veículo escolhido</span><b>${target.brand} ${target.model}</b></div>
    </div><button class="btn gold" style="margin-top:12px" onclick="openPayment('tradein', ${target.id}, ${remaining})">Finalizar troca</button>`;
}

async function addCar(){
  const brand = document.getElementById('new-brand').value.trim();
  const model = document.getElementById('new-model').value.trim();
  const price = parseFloat(document.getElementById('new-price').value)||0;
  const stock = parseInt(document.getElementById('new-stock').value)||1;
  if(!brand||!model){ toast('Preencha marca e modelo.'); return; }
  const imageFiles = [...document.getElementById('new-images').files];
  const images = await Promise.all(imageFiles.map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  })));
  if(API_BASE && state.apiUserId){
    const response = await fetch(`${API_BASE}/cars`, {method:'POST', headers:apiHeaders(true), body:JSON.stringify({brand, model, price, stock, images:images.filter(Boolean)})});

    toast('Veículo adicionado ao catálogo.');
    return;
  }
  const id = Math.max(...ADMIN_CARS.map(c=>c.id))+1;
  ADMIN_CARS.push({id, brand, model, year:2024, category:'Novo cadastro', color:'#666', images:images.filter(Boolean),
    price, stock, engineType:'v8', engine:'—', power:'—', accel:'—', topSpeed:'—', consumption:'—',
    tagline:'Novo veículo cadastrado pelo administrador.', desc:'Descrição a ser preenchida.',
    idealFor:'—', sellingPoint:'—', optionals:[]});
  CATALOG = ADMIN_CARS;
  persistData();
  render();
  toast('Veículo adicionado ao catálogo.');
}

/* ---------------- viewer 360 (arraste para girar) ---------------- */
function setupViewerDrag(){
  const stage = document.getElementById('vd-stage');
  const car = document.getElementById('vd-car');
  if(!stage||!car) return;
  const image = car.querySelector('img');
  const frames = state.currentCar && state.currentCar.images || [];
  let dragging=false, lastX=0, rotY=0, frameDistance=0;
  const start = (x)=>{dragging=true; lastX=x;};
  const move = (x)=>{
    if(!dragging) return;
    const delta = x-lastX; lastX=x;
    if(image && frames.length){
      frameDistance += delta;
      while(Math.abs(frameDistance) >= 45){
        changeViewerFrame(frameDistance > 0 ? 1 : -1);
        frameDistance += frameDistance > 0 ? -45 : 45;
      }
      return;
    }
    rotY += delta*0.6;
    car.style.transform = `rotateY(${rotY}deg) rotateX(6deg)`;
  };
  const end = ()=>{dragging=false;};
  stage.addEventListener('mousedown', e=>start(e.clientX));
  window.addEventListener('mousemove', e=>move(e.clientX));
  window.addEventListener('mouseup', end);
  stage.addEventListener('touchstart', e=>start(e.touches[0].clientX));
  stage.addEventListener('touchmove', e=>move(e.touches[0].clientX));
  stage.addEventListener('touchend', end);
}
